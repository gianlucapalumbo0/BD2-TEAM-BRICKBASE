<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>{{ .title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-200 min-h-screen flex items-center justify-center">

    <div class="bg-slate-900 p-8 rounded-xl border border-slate-800 shadow-xl w-full max-w-md">
        <h2 class="text-2xl font-bold text-amber-500 mb-6 text-center">Registrati a BrickBase</h2>

        <form id="register-form" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Nome</label>
                    <input type="text" id="first_name" required
                        class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Cognome</label>
                    <input type="text" id="last_name" required
                        class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-amber-500">
                </div>
            </div>

            <div>
                <label class="block text-sm text-slate-400 mb-1">Email</label>
                <input type="email" id="email" required
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block text-sm text-slate-400 mb-1">Password (min 6 caratteri)</label>
                <input type="password" id="password" required minlength="6"
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-amber-500">
            </div>

            <!-- NUOVO CAMPO: Selezione Ruolo -->
            <div>
                <label class="block text-sm text-slate-400 mb-1">Seleziona Ruolo</label>
                <select id="role" required
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-amber-500 text-slate-200">
                    <option value="USER">Utente Standard (USER)</option>
                    <option value="ADMIN">Amministratore (ADMIN)</option>
                </select>
            </div>

            <p id="error-msg" class="text-red-500 text-sm hidden"></p>
            <p id="success-msg" class="text-green-500 text-sm hidden">Registrazione completata! Reindirizzamento...</p>

            <button type="submit"
                class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded-lg transition mt-4">
                Crea Account
            </button>
        </form>

        <p class="text-center text-sm text-slate-500 mt-6">
            Hai già un account? <a href="/login" class="text-amber-500 hover:underline">Accedi qui</a>
        </p>
    </div>

    <script src="/static/js/register.js" defer></script>
</body>

</html>
