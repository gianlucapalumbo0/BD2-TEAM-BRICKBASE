<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dettagli Set | BrickBase</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col">

    {{ template "navbar" . }}

    <main class="container mx-auto py-12 px-6 flex-grow">

        <!-- Pulsante indietro e Titolo -->
        <div class="mb-8 flex flex-col items-start gap-4">
            <a href="/sets" class="text-slate-400 hover:text-amber-500 transition text-sm flex items-center gap-2">
                ← Torna ai Set
            </a>
            <h1 id="set-title" class="text-4xl font-bold text-white">Caricamento dettagli...</h1>
        </div>

        <!-- Griglia dei pezzi del set -->
        <div id="set-parts-container"
            class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
            <p id="loading-text" class="text-slate-400">Recupero dell'inventario in corso...</p>
        </div>

    </main>

    <script src="/static/js/navbar.js" defer></script>
    <script src="/static/js/set_detail.js" defer></script>

</body>

</html>
