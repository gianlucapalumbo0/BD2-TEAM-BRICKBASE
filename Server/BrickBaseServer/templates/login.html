<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>{{ .title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-200 min-h-screen flex items-center justify-center">

    <div class="bg-slate-900 p-8 rounded-xl border border-slate-800 shadow-xl w-full max-w-md">
        <h2 class="text-2xl font-bold text-amber-500 mb-6 text-center">Accedi a BrickBase</h2>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm text-slate-400 mb-1">Email</label>
                <input type="email" id="email" required
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block text-sm text-slate-400 mb-1">Password</label>
                <input type="password" id="password" required
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-amber-500">
            </div>

            <p id="error-msg" class="text-red-500 text-sm hidden"></p>

            <button type="submit"
                class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded-lg transition mt-4">
                Entra
            </button>
        </form>

        <p class="text-center text-sm text-slate-500 mt-6">
            Non hai un account? <a href="/register" class="text-amber-500 hover:underline">Registrati</a>
        </p>
    </div>

    <script src="/static/js/login.js" defer></script>
</body>

</html>
