<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo Set | BrickBase</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-200 min-h-screen">

    
    {{ template "navbar" . }}

    <main class="container mx-auto py-12 px-6">
        <h1 class="text-4xl font-bold text-white mb-8">Tutti i nostri Set</h1>
    
        <!-- Griglia responsiva per i set -->
        <div id="all-sets-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Qui JavaScript inietterà le card -->
            <p class="text-slate-400">Caricamento set in corso...</p>
        </div>
    </main>

    <script src="/static/js/set.js" defer></script>
    <script src="/static/js/navbar.js" defer></script>
    

</body>

</html>
